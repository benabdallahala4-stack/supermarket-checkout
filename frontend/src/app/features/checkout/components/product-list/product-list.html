<ul aria-label="Available products" role="list">
  @for (product of products(); track product.id) {
    <li>
      <div class="product-details">
        <h3>{{ product.name }}</h3>
        @if (product.offer; as offer) {
          <p class="offer">{{ offer.quantity }} for {{ currency() }} {{ offer.price }}</p>
        }
      </div>
      <div class="product-actions">
        <p class="unit-price">
          <span>{{ currency() }} {{ product.unitPrice }}</span>
          <span class="unit-label">each</span>
        </p>
        <button
          type="button"
          [attr.aria-label]="'Add ' + product.name + ' to cart'"
          [disabled]="limitProductIds().has(product.id)"
          (click)="add.emit(product.id)"
        >
          Add
        </button>
      </div>
    </li>
  }
</ul>
